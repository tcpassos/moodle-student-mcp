[project]
name = "moodle-student-mcp"
version = "0.1.0"
description = "Servidor MCP para consultar o Moodle como estudante (token do app oficial)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Automatic token capture via browser (SSO flow):
#   pip install -e ".[browser]" && python -m playwright install chromium
browser = ["playwright>=1.40"]

[project.scripts]
moodle-student-mcp = "moodle_student_mcp.server:main"
moodle-student-token = "moodle_student_mcp.token_helper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moodle_student_mcp"]
